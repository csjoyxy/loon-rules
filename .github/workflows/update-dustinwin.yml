name: update-dustinwin
on:
  schedule:
    - cron: "37 20 * * *"   # 每天 04:37 CST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 dustinwin/build.py
      - name: commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dustinwin/*.list
          git diff --cached --quiet || git commit -m "dustinwin auto update $(date -u +%F)"
          git pull --rebase
          git push
